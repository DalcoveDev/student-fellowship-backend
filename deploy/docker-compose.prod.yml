name: isezerano-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - app
      - data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *default-logging

  celery:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
    networks:
      - app
      - data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  celery-beat:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: celery -A config.celery beat --loglevel=info
    networks:
      - app
      - data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../../isezerano-website-frontend}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    networks:
      - app
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
